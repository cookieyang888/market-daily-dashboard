<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日股市监控看板</title>
  <style>
    :root{--bg:#f4f6f3;--ink:#17211c;--muted:#63716a;--line:#d8dfd7;--panel:#fff;--green:#147463;--red:#b74438;--amber:#b57619;--blue:#285c7f;--soft:#eef3ef;--shadow:0 12px 28px rgba(23,33,28,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}.dashboard{max-width:1480px;margin:auto;padding:22px clamp(12px,2.5vw,34px) 36px}
    .hero{min-height:210px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;padding:clamp(22px,4vw,42px);margin-bottom:14px;color:white;background:linear-gradient(135deg,rgba(20,116,99,.97),rgba(40,92,127,.94)),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 54px);border-radius:8px}
    .eyebrow,.label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.hero .eyebrow{color:rgba(255,255,255,.72)}h1,h2,p{margin:0}h1{margin-top:8px;font-size:clamp(32px,5vw,58px);line-height:1.02}h2{margin-top:4px;font-size:20px}.hero-copy{max-width:850px;margin-top:14px;color:rgba(255,255,255,.84);font-size:16px;line-height:1.7}
    .source-strip{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:380px}.source,.badge,.pill{min-height:28px;display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12px;font-style:normal;font-weight:800}.source{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}
    .status-grid{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.status,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.status{min-height:126px;padding:17px}.status.primary{background:var(--ink);color:#fff}.status.primary .label,.status.primary p{color:rgba(255,255,255,.66)}.status strong{display:block;margin-top:10px;font-size:clamp(22px,2vw,30px);line-height:1.15}.status p{margin-top:8px;color:var(--muted);line-height:1.5}
    .main-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.9fr);gap:12px;margin-bottom:12px}.panel{min-width:0;margin-bottom:12px}.panel-head{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:13px}.badge{color:var(--blue);background:#e1edf4}.badge.danger{color:var(--red);background:#f7e4e1}
    .thermo-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px}.gauge{padding:15px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa}.gauge-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:var(--muted)}.gauge-top strong{color:var(--ink)}.gauge-track,.track,.mini{position:relative;overflow:hidden;background:#e9eee8;border-radius:999px}.gauge-track{height:16px}.gauge-track i,.track i,.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:inherit}
    .signal-list{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px}.pill{color:var(--muted);background:#eef2ed}.pill.active{color:var(--amber);background:#fff1d6}.watch-points{margin:0;padding:18px 24px 20px 38px;line-height:1.8;color:#34423a}
    .index-table{display:grid;padding:6px 12px 14px}.index-row{display:grid;grid-template-columns:1.1fr 1fr .8fr 1.2fr 1.2fr 1fr;gap:12px;align-items:center;min-height:48px;padding:8px 6px;border-bottom:1px solid #edf1ec}.index-row:last-child{border-bottom:0}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--muted)}.mini{display:grid;align-items:center;height:28px;min-width:120px}.mini i{grid-area:1/1;opacity:.22}.mini i.down{background:var(--red)}.mini b{grid-area:1/1;padding-left:8px;font-size:12px;z-index:1}
    .sector-stack,.alert-list{display:grid;gap:10px;padding:16px 18px 18px}.sector-line{display:grid;grid-template-columns:90px minmax(80px,1fr) 72px 74px;gap:10px;align-items:center}.track{height:10px}.sector-line em,.stock em{width:max-content;color:var(--blue);background:#e1edf4}.alert{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:8px;background:#f7e4e1}.alert em{color:var(--red);background:#fff}
    .stock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 18px 18px}.stock{min-height:126px;display:grid;align-content:space-between;gap:8px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa}.stock div{display:flex;align-items:center;justify-content:space-between;gap:10px}.stock span,.stock small{color:var(--muted)}.stock p{font-size:24px;font-weight:900}
    .page-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0;padding:14px 16px;border:1px solid #cbdde8;border-radius:8px;background:linear-gradient(135deg,#f8fbff,#eef6f9);box-shadow:var(--shadow)}.page-switch strong{display:block;font-size:16px}.page-switch span{color:var(--muted);font-size:13px;line-height:1.5}.page-switch-button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:8px;padding:0 22px;color:#fff;background:var(--blue);text-decoration:none;font-size:16px;font-weight:900;box-shadow:0 10px 22px rgba(40,92,127,.22)}
    .section-nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow:auto;padding:10px 0;margin:2px 0 12px;background:rgba(244,246,243,.94);backdrop-filter:blur(8px)}.section-nav a{white-space:nowrap;color:var(--blue);background:#e1edf4;border:1px solid #cbdde8;border-radius:999px;padding:8px 11px;text-decoration:none;font-size:12px;font-weight:800}
    .coverage-grid,.module-grid,.check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 18px 18px}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.module-card,.coverage-card,.check-card{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa}.module-card strong,.coverage-card strong,.check-card strong{display:block;margin-bottom:7px}.module-card p,.coverage-card p,.check-card p{color:var(--muted);line-height:1.55;font-size:13px}.coverage-card em{display:inline-flex;margin-top:8px}.raw-tables{display:grid;gap:14px;padding:16px 18px 18px}.raw-group{border-top:1px solid var(--line);padding-top:14px}.raw-group:first-child{border-top:0;padding-top:0}.raw-group h3{margin:0 0 10px;font-size:16px}.raw-table-card{margin-bottom:12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa;overflow:hidden}.raw-table-title{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);font-weight:900}.table-scroll{overflow:auto}.pdf-table{width:100%;min-width:720px;border-collapse:collapse;font-size:12px;line-height:1.45}.pdf-table th,.pdf-table td{padding:9px 10px;border-bottom:1px solid #edf1ec;text-align:left;vertical-align:top}.pdf-table th{position:sticky;top:0;background:#eef3ef;color:var(--muted);font-weight:900}.pdf-table tr:last-child td{border-bottom:0}.table-notes{display:grid;gap:7px;padding:11px 12px;border-top:1px solid #eadcb7;background:#fff7df;color:#5d4516;font-size:12px;line-height:1.55}.table-note{display:grid;grid-template-columns:auto 1fr;gap:7px}.table-note b{color:var(--amber)}.full-table{display:grid;padding:6px 12px 14px}.full-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:12px;align-items:center;min-height:42px;padding:8px 6px;border-bottom:1px solid #edf1ec}.full-row.header{color:var(--muted);font-size:12px;font-weight:800}.full-row:last-child{border-bottom:0}.discipline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 18px 18px}.discipline div{padding:14px;border-radius:8px;background:#f7faf8;border:1px solid var(--line)}.discipline b{display:block;margin-bottom:8px}.discipline span{color:var(--muted);font-size:13px;line-height:1.55}.ai-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff,#f3f8f5)}.ai-hero h2{font-size:28px}.ai-hero p{max-width:880px;margin-top:8px;color:#3b473f;line-height:1.65}.ai-metrics{display:grid;grid-template-columns:repeat(3,88px);gap:8px}.ai-metric{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}.ai-metric strong{display:block;font-size:22px}.ai-metric span{color:var(--muted);font-size:12px}.ai-theme-grid,.ai-card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 18px 18px}.ai-theme,.ai-card,.ai-podcast{border:1px solid var(--line);border-radius:8px;background:#fbfcfa;padding:14px}.ai-action-card{width:100%;font:inherit;color:inherit;text-align:left;appearance:none;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}.ai-action-card:hover{border-color:#b8c8bd;box-shadow:0 10px 24px rgba(23,33,28,.1);transform:translateY(-1px)}.ai-theme h3,.ai-card h3,.ai-podcast h3{margin:0 0 8px;font-size:16px}.ai-theme p,.ai-card p,.ai-podcast p{color:#3f4942;line-height:1.6;font-size:13px}.ai-bar{height:8px;margin:12px 0;border-radius:999px;background:#e9eee8;overflow:hidden}.ai-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}.ai-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ai-card small{display:block;color:var(--muted);line-height:1.4}.ai-date{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:800}.new-dot{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border-radius:999px;background:#f7e4e1;color:var(--red);font-size:11px;font-weight:900}.ai-why{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:#2f3a33}.ai-link{display:inline-flex;margin-top:10px;color:var(--blue);font-weight:800;font-size:13px}.ai-podcast{margin:0 18px 18px}.ai-podcast ul{margin:10px 0 0;padding-left:18px;color:#3f4942;line-height:1.65;font-size:13px}.detail-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(23,33,28,.42)}.detail-modal.open{display:flex}.detail-dialog{width:min(760px,100%);max-height:min(82vh,760px);overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.22)}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px;border-bottom:1px solid var(--line)}.detail-head h3{margin:5px 0 0;font-size:22px}.detail-close{width:34px;height:34px;border:1px solid var(--line);border-radius:999px;background:#f7faf8;cursor:pointer;font-size:20px;line-height:1}.detail-body{display:grid;gap:14px;padding:18px}.detail-section{padding:13px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa}.detail-section strong{display:block;margin-bottom:7px}.detail-section p{white-space:pre-line;color:#334039;line-height:1.65;font-size:14px}.footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;padding:4px 2px 0}
    @media(max-width:980px){.hero,.status-grid,.main-grid,.thermo-row,.ai-hero{grid-template-columns:1fr}.source-strip{justify-content:flex-start}.page-switch{align-items:flex-start;flex-direction:column}.stock-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.index-row{grid-template-columns:1fr 1fr}.ai-theme-grid,.ai-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ai-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.dashboard{padding-inline:10px}.hero{padding:22px}.page-switch-button{width:100%}.stock-grid,.sector-line,.alert,.ai-theme-grid,.ai-card-grid{grid-template-columns:1fr}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="dashboard" id="app"></main>
  <script src="./data/current.js?v=20260804-source-library"></script>
  <script src="./data/daily_tables.js?v=20260804-source-library"></script>
  <script src="./data/ai_builders_digest.js?v=20260804-source-library"></script>
  <script>
    const f=(v,d=2)=>v==null||Number.isNaN(v)?"—":Number(v).toLocaleString("zh-CN",{maximumFractionDigits:d,minimumFractionDigits:d});
    const p=v=>v==null||Number.isNaN(v)?"—":`${v>0?"+":""}${f(v)}%`;
    const tone=v=>v==null?"neutral":v>0?"up":v<0?"down":"neutral";
    const bar=v=>Math.min(Math.abs(v||0)*3,100);
    const action=s=>s.role==="follower"&&(s.pct_chg||0)>3?"反弹减仓":s.role==="follower"?"不加仓":s.role==="core"&&s.tolerance_price&&s.price&&s.price<s.tolerance_price?"触发复盘":s.role==="core"&&(s.pct_20d||0)>20?"小仓持有":s.role==="core"?"核心持有":s.role==="defensive"?"压舱石":"持有观察";
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const detailSection=(title,body)=>body?`<div class="detail-section"><strong>${esc(title)}</strong><p>${esc(body)}</p></div>`:"";
    const detailLink=(url,label="打开全文/原文")=>url?`<a class="ai-link" href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label)}</a>`:"";
    const openDetail=(kind,index)=>{
      const d=window.AI_BUILDERS_DIGEST;
      const item=kind==="podcast"?(d.podcastSources||[])[index]:kind==="category"?(((d.intelligenceBrief||{}).categoryBriefs)||[])[index]:kind==="wechat"?(d.wechatSources||[])[index]:(d.items||[])[index];
      if(!item)return;
      const title=kind==="podcast"?item.name:kind==="category"?item.name:kind==="wechat"?item.name:item.builder;
      const date=kind==="podcast"?item.latestDate:kind==="category"?(d.intelligenceBrief||{}).updatedAt:kind==="wechat"?item.latestDate:item.publishedDate;
      const subtitle=kind==="podcast"?(item.latestTitle||item.role):kind==="category"?(item.sources+" · 公众号 "+(item.articleCount||0)+" / 播客 "+(item.podcastCount||0)):kind==="wechat"?(item.latestTitle||item.focus):(item.topic+" · "+item.role);
      const summary=kind==="podcast"?(item.latestSummary||item.reason):kind==="category"?item.latest:kind==="wechat"?(item.stockUse||item.focus):item.summary;
      const full=kind==="podcast"?item.fullText:kind==="category"?"":kind==="wechat"?(item.latestFullText||"正文暂未缓存；如果原文开放，点击下方链接查看原文；如果聚合页要求付费，则不能绕过付费墙。"):(item.fullText||item.whyItMatters);
      const url=kind==="podcast"?item.url:kind==="wechat"?(item.latestOriginalUrl||item.latestArticleUrl||item.columnUrl):item.url;
      const detailBlocks=kind==="category"?(item.detailSections||[]).map(s=>detailSection(s.title,s.body)).join(""):`${detailSection(kind==="podcast"?"最新一期":kind==="wechat"?"最新文章":"动态主题",subtitle)}${detailSection("总结",summary)}${detailSection("股市分析",item.stockLens)}${detailSection(kind==="wechat"?"正文":"全文",full)}${detailLink(url,kind==="wechat"?(item.latestOriginalUrl?"打开微信原文":"打开可访问页"):"打开全文/原文")}`;
      const modal=document.getElementById("detail-modal");
      modal.innerHTML=`<div class="detail-dialog" role="dialog" aria-modal="true"><div class="detail-head"><div><span class="label">${kind==="podcast"?"播客详情":kind==="category"?"分类深读":kind==="wechat"?"公众号全文":"动态详情"}</span><h3>${esc(title)}</h3><p class="ai-date">${esc(date||"")}${item.isNew?'<span class="new-dot">NEW</span>':""}</p></div><button class="detail-close" type="button" aria-label="关闭">×</button></div><div class="detail-body">${kind==="category"?detailSection("来源范围",subtitle)+detailSection("最新线索",summary):""}${detailBlocks}</div></div>`;
      modal.classList.add("open");
    };
    const closeDetail=()=>{
      const modal=document.getElementById("detail-modal");
      if(modal)modal.classList.remove("open");
    };
    const renderDataTable=t=>{
      const [head,...body]=t.rows;
      const notes=(t.notes||[]).map(n=>`<div class="table-note"><b>标注</b><span>${esc(n)}</span></div>`).join("");
      return `<article class="raw-table-card"><div class="raw-table-title"><span>${esc(t.title)}</span><small class="muted">日更模型</small></div><div class="table-scroll"><table class="pdf-table"><thead><tr>${head.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${notes?`<div class="table-notes">${notes}</div>`:""}</article>`;
    };
    const renderDailyTables=()=>{
      const groups=(window.DAILY_TABLES||[]).reduce((acc,t)=>{(acc[t.section] ||= []).push(t);return acc;},{});
      return Object.entries(groups).map(([section,tables])=>`<div class="raw-group"><h3>${esc(section)}</h3>${tables.map(renderDataTable).join("")}</div>`).join("");
    };
    const renderAiDigest=()=>{
      const d=window.AI_BUILDERS_DIGEST;
      if(!d)return "";
      const stock=d.stockResearch||{};
      const podcast=d.podcastSources||[];
      const wechat=d.wechatSources||[];
      const wechatArticles=d.wechatArticles||[];
      const intel=d.intelligenceBrief||{};
      const intelSources=d.intelligenceSources||[];
      const intelItems=d.intelligenceItems||[];
      const sensitivity=stock.valuationSensitivity||{};
      const sensitivityVars=(sensitivity.variables||[]).map(x=>`<div class="ai-card"><div class="ai-card-head"><div><h3>${esc(x.symbol)} · ${esc(x.name)}</h3><small>${esc(x.direction==="risk"?"风险变量":"跟踪变量")}</small></div><span class="pill ${x.direction==="risk"?"active":""}">${esc(x.direction==="risk"?"压估值":"看兑现")}</span></div><p>${esc(x.signal)}</p><div class="ai-why">${esc(x.marketUse)}</div></div>`).join("");
      const sensitivityScenarios=(sensitivity.scenarioMap||[]).map(x=>`<div class="module-card"><strong>${esc(x.name)} · ${esc(x.valuation)}</strong><p>${esc(x.marketMeaning)}</p></div>`).join("");
      const sensitivityChecklist=(sensitivity.dailyChecklist||[]).map((x,i)=>`<div class="check-card"><strong>${i+1}. 日更验证</strong><p>${esc(x)}</p></div>`).join("");
      const stockLenses=(stock.lenses||[]).map(x=>`<div class="module-card"><strong>${esc(x.name)}</strong><p>${esc(x.rule)}</p></div>`).join("");
      const stockUniverse=(stock.universe||[]).map(x=>`<div class="module-card"><strong>${esc(x.bucket)}</strong><p>${esc((x.examples||[]).join(" / "))}</p><p>${esc(x.focus||"")}</p></div>`).join("");
      const intelDaily=(intel.dailyOutput||[]).map(x=>`<div class="module-card"><strong>${esc(x.name)}</strong><p>${esc(x.rule)}</p></div>`).join("");
      const intelPresentation=(intel.presentation||[]).map(x=>`<div class="module-card"><strong>${esc(x.name)}</strong><p>${esc(x.rule)}</p></div>`).join("");
      const intelItemCards=intelItems.map(x=>`<div class="ai-card"><div class="ai-card-head"><div><h3>${esc(x.source)}</h3><small>${esc(x.group)} · ${esc(x.type)} · ${esc(x.publishedDate||x.relativeTime||"时间待识别")}</small></div>${x.isNew?'<span class="new-dot">NEW</span>':""}</div><p><strong>${esc(x.title)}</strong></p><p>${esc(x.summary)}</p><div class="ai-why"><strong>投资映射：</strong>${esc(x.investmentMap)}</div><div class="ai-why"><strong>验证：</strong>${esc(x.verification)}</div>${x.url?`<a class="ai-link" href="${esc(x.url)}" target="_blank" rel="noreferrer">打开原文</a>`:""}</div>`).join("");

        <section class="main-grid" data-tab="overview"><div class="panel"><div class="panel-head"><div><span class="label">Breadth / Volume</span><h2>市场温度</h2></div><span class="badge">${right?"右侧":"左侧"}</span></div><div class="thermo-row"><div class="gauge"><div class="gauge-top"><span>上涨占比</span><strong>${f(breadth,1)}%</strong></div><div class="gauge-track"><i style="width:${Math.min(breadth,100)}%"></i></div></div><div class="gauge"><div class="gauge-top"><span>量能确认</span><strong>${f(turnover,2)}x</strong></div><div class="gauge-track"><i style="width:${Math.min(turnover*100,100)}%"></i></div></div></div><div class="signal-list">${[["小盘/成长修复",growth],["防御滞涨",defLag],["BOLL 中轨未突破",below>=2],["MACD 空头",bear>=2]].map(x=>`<span class="pill ${x[1]?"active":""}">${x[0]}</span>`).join("")}</div></div><div class="panel"><div class="panel-head"><div><span class="label">Next Session</span><h2>明日观察</h2></div></div><ol class="watch-points"><li>成交额能否逼近或超过 24000 亿。</li><li>核心指数是否站上 BOLL 中轨。</li><li>AI 核心是否放量站稳。</li><li>从龙反弹后是否二次探底。</li></ol></div></section>
        <section class="panel" data-tab="market"><div class="panel-head"><div><span class="label">Indexes</span><h2>指数技术位</h2></div><span class="muted">${below}/${tech.length} 低于中轨</span></div><div class="index-table">${m.indexes.map(x=>`<div class="index-row"><strong>${x.name}</strong><span>${f(x.close)}</span><span class="${tone(x.pct_chg)}">${p(x.pct_chg)}</span><span class="mini"><i class="${tone(x.pct_20d)}" style="width:${bar(x.pct_20d)}%"></i><b>${p(x.pct_20d)}</b></span><span>${x.boll_mid?`中轨 ${f(x.boll_mid)}`:"—"}</span><span class="${tone(x.macd_bar)}">${x.macd_bar==null?"—":`MACD ${f(x.macd_bar)}`}</span></div>`).join("")}</div></section>
        <section class="main-grid" data-tab="rotation"><div class="panel"><div class="panel-head"><div><span class="label">Rotation</span><h2>板块轮动</h2></div></div><div class="sector-stack">${sectors.map(s=>`<div class="sector-line"><span>${s.name}</span><div class="track"><i style="width:${Math.min(Math.abs(s.pct_chg||0)*10,100)}%"></i></div><strong class="${tone(s.pct_chg)}">${p(s.pct_chg)}</strong><em class="pill">${s.action_hint}</em></div>`).join("")}</div></div><div class="panel"><div class="panel-head"><div><span class="label">Follower Risk</span><h2>从龙负反馈</h2></div><span class="badge danger">${alerts.length} 个警报</span></div><div class="alert-list">${alerts.map(a=>`<div class="alert"><strong>${a.symbol}</strong><span>${p(a.pct_chg)} / 换手 ${p(a.turnover_rate)}</span><em class="pill">反弹减仓</em></div>`).join("")}</div></div></section>
        <section class="panel" id="global" data-tab="global"><div class="panel-head"><div><span class="label">Global Cross Check</span><h2>全球多市场交叉验证</h2></div><span class="muted">外部驱动弱，A股以内生修复为主</span></div><div class="full-table"><div class="full-row header"><span>市场</span><span>收盘</span><span>当日</span><span>20日</span><span>判断</span></div>${globalRows.map(x=>`<div class="full-row"><strong>${x[0]}</strong><span>${x[1]}</span><span class="${x[2].startsWith('-')?'down':'up'}">${x[2]}</span><span class="${x[3].startsWith('-')?'down':'up'}">${x[3]}</span><span>${x[4]}</span></div>`).join("")}</div><div class="module-grid"><div class="module-card"><strong>全球结论</strong><p>A股反弹主要来自内部风险偏好修复，非外围强驱动；港股同步弹性修复，美股科技偏弱，日韩数据缺失。</p></div></div></section>
        <section class="panel" id="market" data-tab="market"><div class="panel-head"><div><span class="label">A-share Portrait</span><h2>A股大盘画像</h2></div><span class="muted">广度、量能、估值、技术位</span></div><div class="module-grid"><div class="module-card"><strong>涨跌分布</strong><p>上涨 ${m.market.up_count} 家，下跌 ${m.market.down_count} 家，上涨占比 ${f(breadth,1)}%。${breadth>=55?"风险偏好修复扩散。":"上涨家数未占优，仍按震荡和分化处理。"}</p></div><div class="module-card"><strong>成交额</strong><p>${f(m.market.total_turnover_billion,0)} 亿，约为 20 日均量 ${f(turnover,2)} 倍；${right?"已进入右侧确认量能区。":"未到 24000 亿右侧确认线。"}</p></div><div class="module-card"><strong>技术位</strong><p>${below}/${tech.length} 个核心技术指数低于 BOLL 中轨，${bear}/${tech.length} 个 MACD 仍在空头区。</p></div><div class="module-card"><strong>估值</strong><p>中证全指 PE 10 年分位 ${f(m.market.valuation_percentile_10y,1)}%，反弹中追高性价比偏低。</p></div></div><div class="table-scroll"><table class="pdf-table"><thead><tr><th>评分维度</th><th>跟踪指标</th><th>分析规则</th></tr></thead><tbody>${marketScoreRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
        <section class="panel" id="rotation" data-tab="rotation"><div class="panel-head"><div><span class="label">Six Clusters</span><h2>六大板块聚类</h2></div><span class="muted">按原报告聚类补齐</span></div><div class="module-grid">${clusters.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p><b>${x[1]}</b></p><p>${x[2]}</p></div>`).join("")}</div><div class="table-scroll"><table class="pdf-table"><thead><tr><th>资金行为</th><th>盘面表现</th><th>分析含义</th></tr></thead><tbody>${capitalStyleRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
        <section class="panel" data-tab="rotation"><div class="panel-head"><div><span class="label">Industry Framework</span><h2>行业整体框架分析</h2></div><span class="muted">对应 PDF 四、②</span></div><div class="module-grid">${industryFrames.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join("")}</div><div class="table-scroll"><table class="pdf-table"><thead><tr><th>结构角色</th><th>代表对象</th><th>交易含义</th></tr></thead><tbody>${structureRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
        <section class="panel" id="stocks" data-tab="stocks"><div class="panel-head"><div><span class="label">Watchlist</span><h2>核心个股池</h2></div><span class="muted">${m.watchlist.length} 个标的</span></div><div class="stock-grid">${m.watchlist.map(s=>`<div class="stock"><div><strong>${s.symbol}</strong><span>${s.group}</span></div><p class="${tone(s.pct_chg)}">${p(s.pct_chg)}</p><small>20日 ${p(s.pct_20d)} · 换手 ${p(s.turnover_rate)}</small><em class="pill">${action(s)}</em></div>`).join("")}</div></section>
        <section class="panel" data-tab="stocks"><div class="panel-head"><div><span class="label">Holding Split</span><h2>核心持仓分化解读</h2></div><span class="muted">跟随当日个股池数据</span></div><div class="module-grid">${holdingSplitLive.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join("")}</div></section>
        <section class="panel" id="emotion" data-tab="emotion"><div class="panel-head"><div><span class="label">Chapter 5</span><h2>情绪周期定位</h2></div><span class="badge">${state}</span></div><div class="module-grid"><div class="module-card"><strong>情绪位置</strong><p>当前上涨占比 ${f(breadth,1)}%，${breadth>=55?"情绪有扩散修复。":"广度不足，不能按全面反转理解。"}</p></div><div class="module-card"><strong>大小盘</strong><p>中证1000 ${p(zz&&zz.pct_chg)}，上证50 ${p(sz50&&sz50.pct_chg)}，${growth?"小盘/成长明显占优。":"大小盘相对强弱仍未确认。"}</p></div><div class="module-card"><strong>持续性门槛</strong><p>需要放量、连续广度、指数站上中轨共同确认，否则仍按左侧反弹处理。</p></div></div></section>
        <section class="panel" id="dragon" data-tab="dragon"><div class="panel-head"><div><span class="label">Chapter 6</span><h2>从龙负反馈监测</h2></div><span class="badge danger">${alerts.length} 个警报</span></div><div class="alert-list">${alerts.map(a=>`<div class="alert"><strong>${a.symbol}</strong><span>${p(a.pct_chg)} / 换手 ${p(a.turnover_rate)}</span><em class="pill">反弹减仓</em></div>`).join("")}<div class="alert"><strong>雅克/风华/杰瑞</strong><span>涨停出货与油服净卖代表机构借反弹兑现</span><em class="pill">观察二探</em></div></div></section>
        <section class="panel" id="style" data-tab="style"><div class="panel-head"><div><span class="label">Chapter 7</span><h2>市场风格判断</h2></div></div><div class="check-grid"><div class="check-card"><strong>成长/小盘</strong><p>${growth?'超跌反扑成立':'尚未确认'}，但未等于趋势切换。</p></div><div class="check-card"><strong>红利/防御</strong><p>${defLag?'反弹日滞涨':'未明显滞涨'}，压舱属性保留。</p></div><div class="check-card"><strong>主线/杂毛</strong><p>主线与低位题材是否扩散，要继续看资金流、成交额和核心池强弱。</p></div><div class="check-card"><strong>量化特征</strong><p>${breadth>=55?"广度修复暂缓阴跌压力。":"广度偏弱，分化交易仍主导。"}持续性看次日量能。</p></div></div><div class="table-notes"><div class="table-note"><b>状态评价</b><span>市场状态不只看涨跌，还要看趋势、情绪、估值、技术和资金是否同向。上涨但量能、龙头或技术位不确认时，只能判为修复，不能判为反转。</span></div></div></section>
        <section class="panel" id="funds" data-tab="funds"><div class="panel-head"><div><span class="label">Capital / Dragon Tiger</span><h2>资金与龙虎榜</h2></div><span class="muted">机构买卖方向</span></div><div class="full-table"><div class="full-row header"><span>个股/方向</span><span>机构净买</span><span>主题</span><span>信号</span><span>动作含义</span></div>${m.longhubang.map(x=>`<div class="full-row"><strong>${x.name}</strong><span class="${tone(x.net_inst_buy_billion)}">${x.net_inst_buy_billion==null?'—':(x.net_inst_buy_billion>0?'+':'')+f(x.net_inst_buy_billion)+' 亿'}</span><span>${x.theme}</span><span>${x.note}</span><span>${(x.net_inst_buy_billion||0)<0?'边打边撤':'题材回补'}</span></div>`).join("")}</div></section>
        <section class="main-grid" id="three" data-tab="three"><div class="panel"><div class="panel-head"><div><span class="label">Three-layer Check</span><h2>三类观测指标</h2></div></div><div class="module-grid">${threeLayerLive.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p><em class="pill">${x[2]}</em></div>`).join("")}</div></div><div class="panel"><div class="panel-head"><div><span class="label">Conclusion</span><h2>综合判断</h2></div></div><div class="module-grid"><div class="module-card"><strong>离场标准</strong><p>${breadth<35&&below>=2?"广度偏弱且技术未确认，避免把弱反弹误判为反转。":"未出现两类明确负面共同触发，故不做系统性离场。"}</p></div><div class="module-card"><strong>加仓标准</strong><p>${right?"量能、广度和技术位已进入右侧确认区，可按系统提高仓位。":"未满足右侧确认，尚不足以加仓。"}</p></div><div class="module-card"><strong>纪律</strong><p>仓位 ${cap}；信号未确认前，核心持有、从龙按反弹和资金流处理。</p></div></div></div></section>
        <section class="main-grid" id="vol" data-tab="vol asym"><div class="panel"><div class="panel-head"><div><span class="label">Volatility</span><h2>波动率与升贴水实操</h2></div><span class="muted">BOLL / MACD / 拥挤</span></div><div class="module-grid">${volatility.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p><p>${x[2]}</p></div>`).join("")}</div></div><div class="panel" id="asym"><div class="panel-head"><div><span class="label">Asymmetry</span><h2>非对称性与多空比价</h2></div><span class="badge danger">不动手区</span></div><div class="module-grid">${asymmetry.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p><p>${x[2]}</p></div>`).join("")}<div class="module-card"><strong>做多盈亏比</strong><p>上证、创业板、科创50 均未显著大于 1，趋势做多不占优。</p></div><div class="module-card"><strong>做空盈亏比</strong><p>A股融券和个股做空受限，做空工具不天然占优。</p></div><div class="module-card"><strong>双买策略适用性</strong><p>降波环境时间价值损耗不利，更适合等待波动率回归。</p></div></div></div></section>
        <section class="panel" id="preopen" data-tab="preopen"><div class="panel-head"><div><span class="label">10 Checks</span><h2>每日盘前 10 点检查</h2></div><span class="muted">${m.meta.trade_date} 执行清单</span></div><div class="check-grid">${preopen.map((x,i)=>`<div class="check-card"><strong>${i+1}. ${x}</strong><p>${i===0?state:i===1?`${below}/${tech.length} 个核心技术指数低于 BOLL 中轨`:i===2?'AI 算力与应用估值框架已接入，继续看收入兑现和资本效率':i===3?'海外/港股候选表已纳入接入链路，按覆盖日判断强弱':i===4?'AI估值雷达优先看 sigma*、s、m、delta、T 的边际变化':i===5?`核心池 ${watchUp} 涨 / ${watchDown} 跌，观察主龙和从龙是否背离`:i===6?alerts.length?`从龙反弹警报 ${alerts.length} 个，观察二次探底`:'从龙警报较少，继续等待资金流验证':i===7?growth?'成长/小盘相对强，但需量能确认':'成长/小盘未形成明确相对强势':i===8?`仓位 ${cap}；未右侧确认不追高`:'标注各数据源覆盖日，不把滞后源当成实时信号'}</p></div>`).join("")}</div></section>
        <section class="panel" id="system" data-tab="system"><div class="panel-head"><div><span class="label">Trading System</span><h2>交易系统框架</h2></div><span class="muted">执行纪律</span></div><div class="discipline">${systemRules.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div><div class="module-grid">${systemFlow.map(x=>`<div class="module-card"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join("")}</div><div class="table-scroll"><table class="pdf-table"><thead><tr><th>组合管理项</th><th>规则</th><th>执行含义</th></tr></thead><tbody>${portfolioRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
        <footer class="footer"><span>${m.meta.data_notes}</span><span>生成日期 ${m.meta.report_date}</span></footer>`;
      document.querySelectorAll("[data-detail-kind]").forEach(btn=>{
        btn.addEventListener("click",()=>openDetail(btn.dataset.detailKind,Number(btn.dataset.detailIndex)));
      });
      document.addEventListener("click",event=>{
        if(event.target.id==="detail-modal"||event.target.classList.contains("detail-close"))closeDetail();
      });
      document.addEventListener("keydown",event=>{if(event.key==="Escape")closeDetail();});
    }).catch(err=>{document.getElementById("app").innerHTML="<p>数据加载失败："+err.message+"</p>"});
  </script>
</body>
</html>
